<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
{% extends "base.html" %}
{% block content %}
<h1>issued_books</h1>
<table>
    <tr>
        <th>Member</th>
        <th>Book</th>
        <th>Issue Date</th>
        <th>Due Date</th>
        <th>Action</th>
    </tr>
    {% for issue in issued_books %}
    <tr>
        <td>{{issue.username}}</td>
        <td>{{books[issue.book_id]['title']}}</td>
        <td>{{issue.issue_date}}</td>
        <td>{{issue.due_date}}</td>
        <td><a href="{{ url_for('return_book', index=loop.index0) }}">Return Book</a></td>
    </tr>
    {% endfor%}
</table>
{% endblock %}
</body>    
</html>
